# The SPA, /api and /ws on one machine and one origin. See DEPLOY.md.

app = 'pixel-imperium'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]

[deploy]
  release_command = 'pnpm db:migrate'
  strategy = 'immediate'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpus = 1
